<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProductMarket</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f5f0;
            color: #222;
        }

        header {
            background: rgb(253, 253, 253);
            padding: 45px 90px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #222;
            text-decoration: none;
            font-family: Cardo;
            font-size: 20px;
        }

        nav a:hover {
            color: #ffffff;
            background: black;
        }

        main {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 45px 90px;
            margin-top: 60px;

            p{
                font-size: 40px;
            }

            a{
                text-decoration: none;
                color: white;
                font-size: 20px;
            }
        }

    </style>
</head>
<body>
    
<header>
    <div class="logo">ProductMarket</div>

    <nav>
        <a href="{% url 'index' %}">Home</a>
        <a href="/catalog">catalog</a>
        <a href="">contacts</a>
    </nav>
</header>


<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    <p>ProductMarket</p>
    <a href="">baty03</a>
</footer>

</body>
</html>

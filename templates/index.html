{% extends "base.html" %}
{% load static %}

{% block content %}

<style>
    .hero {
        position: relative;
        height: 550px;
        margin: 30px auto 0;
        background-image: url("{% static 'hero-img.webp' %}");
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }
        
    .hero-content {
        text-align: center;
        max-width: 700px;
    }

    h1 {
        font-size: 35px;
        margin-bottom: 20px;
        line-height: 1.4;
        color: white;
        -webkit-text-stroke: 2px rgb(0, 0, 0);
    }

    a{
        display: inline-block;
        padding: 10px 35px;
        border: 1px solid white;
        color: white;
        text-decoration: none;
        font-size: 18px;
    }


    a:hover {
        background: white;
        color: #222;
    }

    .product-list{
        display: flex;
        justify-content: center;
    }

    
    .product-section {
        display: grid;
        grid-template-columns: 1fr 2fr;
        min-height: 350px;
        margin-bottom: 20px;
        background: white;
    }

    
    .product-text {
        padding: 10px 10px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
    }



</style>

<section class="hero">
    <div class="hero-content">

        <h1>самые свежие товары только у нас!</h1>
        <a href="/catalog">discover now</a>

    </div>
</section>

<div class="product-list">
    {% for product in products %}
    
    <div class="product-section">

        <div class="product-text">

            <h2>{{ product.name }}</h2>

            <p class="product-price">
                ${{ product.price }}
            </p>

            <p class="description">
                {{ product.description }}
            </p>

        </div>

    </div>

    <div class="product-img">

        <img src="{{ product.image.url }}" alt="{{ product.name }}">

    </div>

    {% endfor %}
</div>

{% endblock %}

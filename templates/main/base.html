<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoodenDot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f5f0;
            color: #222;
        }

        header {
            background: rgb(255, 255, 255);
            padding: 45px 90px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #222;
            text-decoration: none;
            font-family: Cardo;
            font-size: 20px;
        }

        nav a:hover {
            color: #8b6f47;
        }

        main {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 45px 90px;
            margin-top: 60px;

            p{
                font-size: 30px;
            }
        }

        


    </style>

</head>
<body>

<header>
    <div class="logo">WoodenDot</div>

    <nav>
        <a href="{% url 'index' %}">Home</a>
        <a href="{% url 'catalog' %}">Catalog</a>
    </nav>
</header>


<main>
    {% block content %}
    {% endblock %}
</main>


<footer>
    <p>2026 WoodenDot</p>
</footer>

</body>
</html>
